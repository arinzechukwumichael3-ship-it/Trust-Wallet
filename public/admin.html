<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Helpry Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0500ff;
      --primary-dark: #0400cc;
      --bg: #f0f2f5;
      --surface: #ffffff;
      --text: #111827;
      --muted: #68707a;
      --border: #e3e7ee;
      --success: #10b981;
      --client-bubble: #0500ff;
      --admin-bubble: #ffffff;
      --appbar-h: 56px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Roboto', -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #0b1020;
      color: var(--text);
    }

    /* Phone frame — fills the screen on mobile, looks like a device on desktop */
    #phone {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    @media (min-width: 480px) {
      #phone {
        height: min(880px, 96vh);
        margin: 2vh auto;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.08);
      }
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transform: translateX(0);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #chatView { transform: translateX(100%); }
    #chatView.active { transform: translateX(0); }
    .hidden { display: none !important; }

    /* Material app bar */
    .appbar {
      flex: 0 0 var(--appbar-h);
      height: var(--appbar-h);
      min-height: var(--appbar-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      padding-top: env(safe-area-inset-top);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      z-index: 5;
    }
    .appbar .title { font-size: 1.05rem; font-weight: 500; flex: 1; line-height: 1.1; }
    .appbar .title-unread {
      display: inline-block; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px;
      border-radius: 10px; background: #ff3b30; color: #fff; font-size: 0.72rem; font-weight: 700;
      text-align: center; line-height: 20px; vertical-align: middle;
    }
    .appbar .sub { font-size: 0.72rem; font-weight: 400; opacity: 0.9; margin-top: 2px; }
    .appbar .icon-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 0; background: transparent; color: #fff;
      border-radius: 50%; cursor: pointer;
      transition: background 0.15s;
    }
    .appbar .icon-btn:active { background: rgba(255,255,255,0.18); }
    .appbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }

    .status-dot {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 500; padding: 4px 10px;
      border-radius: 999px; background: rgba(255,255,255,0.16);
    }
    .status-dot .pulse {
      width: 8px; height: 8px; border-radius: 50%; background: var(--success);
      box-shadow: 0 0 0 0 rgba(16,185,129,0.6);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); }
      70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }
    .status-dot.error { background: rgba(239,68,68,0.25); }
    .status-dot.error .pulse { background: #f87171; animation: none; }

    /* Conversation list */
    .list-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .client-list { list-style: none; margin: 0; padding: 0; }
    .client-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .client-item:active { background: #eef1f6; }
    .client-item.active { background: #eef0ff; }

    .avatar {
      position: relative;
      flex: 0 0 48px; width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.05rem; color: #fff;
      background: linear-gradient(135deg, #0500ff, #00d395);
    }
    .online-dot {
      position: absolute; right: 0; bottom: 0;
      width: 13px; height: 13px; border-radius: 50%;
      background: #cbd5e0; border: 2.5px solid #fff;
    }
    .online-dot.on { background: var(--success); }
    .row-main { flex: 1; min-width: 0; }
    .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .row-name { font-weight: 600; font-size: 0.97rem; color: var(--text); }
    .row-time { font-size: 0.72rem; color: var(--muted); flex: 0 0 auto; }
    .row-meta {
      margin-top: 1px; font-size: 0.74rem; color: var(--primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-preview {
      margin-top: 3px; font-size: 0.83rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-email {
      margin-top: 2px; font-size: 0.72rem; color: var(--primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Search box */
    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      margin: 8px 12px; padding: 0 12px;
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
    }
    .search-ico { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
    .search-input {
      flex: 1; border: 0; outline: none; background: transparent;
      padding: 11px 0; font-size: 0.9rem; font-family: inherit; color: var(--text);
    }
    .search-input::placeholder { color: #aab2bd; }
    /* Chat header avatar */
    .chat-avatar {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.95rem; color: #fff;
      background: linear-gradient(135deg, #0500ff, #00d395);
    }
    .badge {
      flex: 0 0 auto; min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 999px; background: var(--primary); color: #fff;
      font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .badge.unread { background: #ff3b30; animation: pulseUnread 1.4s infinite; }
    @keyframes pulseUnread {
      0% { box-shadow: 0 0 0 0 rgba(255,59,48,0.5); }
      70% { box-shadow: 0 0 0 6px rgba(255,59,48,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); }
    }
    .del-btn {
      flex: 0 0 auto; width: 34px; height: 34px; border: 0; border-radius: 50%;
      background: transparent; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .del-btn:hover { background: rgba(239,68,68,0.12); color: #ef4444; }
    .del-btn:active { transform: scale(0.9); }
    .del-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .storage-note {
      font-size: 0.72rem; padding: 8px 14px; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .storage-note.persistent { background: #e7f8f0; color: #0c8a5b; }
    .storage-note.temp { background: #fff7e6; color: #b7791f; }
    .toast {
      pointer-events: auto;
      background: var(--primary); color: #fff;
      padding: 12px 16px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      font-size: 0.88rem; max-width: 90vw; width: 320px;
      display: flex; align-items: center; gap: 10px;
      animation: toastIn 0.22s ease-out; cursor: pointer;
    }
    .toast .t-title { font-weight: 700; }
    .toast .t-sub { opacity: 0.9; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast.out { animation: toastOut 0.25s ease-in forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(12px); } }
    .empty {
      text-align: center; color: var(--muted); padding: 48px 24px; font-size: 0.9rem;
    }

    /* Chat thread */
    .thread {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px 12px 8px;
      background:
        radial-gradient(circle at 20% 20%, rgba(5,0,255,0.04), transparent 40%),
        var(--bg);
      display: flex; flex-direction: column; gap: 8px;
    }
    .day-sep { text-align: center; margin: 4px 0; }
    .day-sep span {
      font-size: 0.7rem; color: var(--muted); background: rgba(255,255,255,0.7);
      padding: 3px 10px; border-radius: 999px;
    }
    .msg { display: flex; max-width: 82%; }
    .msg.client { align-self: flex-end; justify-content: flex-end; }
    .msg.admin { align-self: flex-start; justify-content: flex-start; }
    .bubble {
      padding: 9px 12px; border-radius: 16px; line-height: 1.45;
      font-size: 0.92rem; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }
    .msg.client .bubble { background: var(--client-bubble); color: #fff; border-bottom-right-radius: 5px; }
    .msg.admin .bubble { background: var(--admin-bubble); color: var(--text); border-bottom-left-radius: 5px; border: 1px solid var(--border); }
    .bubble .t { display: block; margin-top: 4px; font-size: 0.66rem; opacity: 0.75; text-align: right; }
    .msg.client .bubble .t { color: rgba(255,255,255,0.85); }
    .bubble .msg-text { white-space: pre-wrap; word-break: break-word; }
    .media-grid {
      display: grid; gap: 4px; margin-bottom: 4px;
      grid-template-columns: repeat(2, 1fr);
    }
    .media-grid > a { display: block; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 12px; }
    .media-grid > a:only-child { grid-column: 1 / -1; aspect-ratio: 4 / 3; }
    .bubble .file-chip {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
      padding: 8px 12px; border-radius: 10px; background: rgba(5,0,255,0.08);
      color: var(--primary); text-decoration: none; font-size: 0.82rem; max-width: 100%;
    }
    .bubble .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }

    /* Composer */
    .composer {
      flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
      padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .composer textarea {
      flex: 1; width: 100%; max-height: 120px; min-height: 44px;
      resize: none; border: 0; outline: none; border-radius: 22px;
      background: var(--bg); color: var(--text);
      padding: 11px 16px; font-family: inherit; font-size: 0.95rem;
    }
    .attach-btn {
      flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 50%;
      background: var(--bg); color: var(--primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: transform 0.12s, background 0.12s, box-shadow 0.12s;
    }
    .attach-btn:active { transform: scale(0.92); background: rgba(5,0,255,0.1); }
    .attach-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
    .attach-badge {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
      padding: 0 4px; border-radius: 9px; background: #ff3b30; color: #fff;
      font-size: 0.62rem; font-weight: 700; line-height: 18px; text-align: center;
      box-shadow: 0 0 0 2px var(--surface);
    }
    .attach-preview {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px 0;
    }
    .atch-chip {
      display: flex; align-items: center; gap: 6px; max-width: 160px;
      background: #eef2ff; border: 1px solid #dbe2ff; border-radius: 10px;
      padding: 4px 8px; font-size: 0.78rem; color: #334155;
    }
    .atch-chip img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex: 0 0 auto; }
    .atch-chip .fic { font-size: 1.1rem; flex: 0 0 auto; }
    .atch-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .send-btn {
      flex: 0 0 auto; width: 46px; height: 46px; border: 0; border-radius: 50%;
      background: var(--primary); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 8px rgba(5,0,255,0.4);
      transition: transform 0.12s, background 0.12s;
    }
    .send-btn:active { transform: scale(0.92); background: var(--primary-dark); }
    .send-btn svg { width: 22px; height: 22px; fill: #fff; }
  </style>
</head>
<body>
<!-- Login gate (shown until the admin session cookie is valid) -->
<div id="loginOverlay" class="view" style="position:absolute; inset:0; z-index:50; background:var(--bg);">
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; gap:22px;">
    <div style="width:84px; height:84px; border-radius:24px; background:linear-gradient(135deg,#0500ff,#00d395); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(5,0,255,0.35);">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="#fff"><path d="M12 1l9 4v6c0 5-3.8 9.7-9 11-5.2-1.3-9-6-9-11V5l9-4z"/></svg>
    </div>
    <div style="text-align:center;">
      <div style="font-size:1.3rem; font-weight:700; color:var(--text);">Helpry Admin</div>
      <div style="font-size:0.85rem; color:var(--muted); margin-top:4px;">Sign in to manage support chats</div>
    </div>
    <form id="loginForm" style="width:100%; max-width:300px; display:flex; flex-direction:column; gap:12px;">
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Admin password"
        style="width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:1rem; font-family:inherit; outline:none;" />
      <button type="submit" style="width:100%; padding:14px; border:0; border-radius:14px; background:var(--primary); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;">Sign in</button>
      <div id="loginError" style="color:#ef4444; font-size:0.82rem; text-align:center; min-height:1em;"></div>
    </form>
  </div>
</div>

        <textarea id="replyInput" rows="1" placeholder="Message the client…"></textarea>
        <button id="sendReplyBtn" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M3 20.5l18-8.5-18-8.5 0 6.5 12 2-12 2z"/></svg>
        </button>
      </div>
      <div id="adminAttachPreview" class="attach-preview" style="display:none;"></div>
    </section>
  </div>

  <script>
    let clients = [];
    let selectedClientId = null;

    const listView = document.getElementById('listView');
    const chatView = document.getElementById('chatView');
    const clientListEl = document.getElementById('clientList');
    const messagesEl = document.getElementById('messages');

    function setStatus(text, isError) {
      const t = document.getElementById('listStatusText');
      const d = document.getElementById('listStatus');
      t.textContent = text;
      d.classList.toggle('error', !!isError);
    }
    function setChatStatus(text, isError) {
      const t = document.getElementById('chatStatusText');
      const d = document.getElementById('chatStatus');
      t.textContent = text;
      d.classList.toggle('error', !!isError);
    }

    function formatTime(value) {
      if (!value) return '';
      const d = new Date(value);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    function lastMessage(client) {
      return client.messages.length ? client.messages[client.messages.length - 1] : null;
    }

    // ---- New-message notifications (toast + sound + system notification) ----
    let knownMessageIds = new Set();   // ids we've already shown
    let unreadCounts = {};             // clientId -> number of unread client messages
    let notifEnabled = false;

    async function ensureNotifPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') { notifEnabled = true; return; }
      if (Notification.permission !== 'denied') {
        try { const p = await Notification.requestPermission(); notifEnabled = (p === 'granted'); } catch (e) {}
      }
    }

    function playBeep() {
      const a = document.getElementById('notifSound');
      if (!a) return;
      try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
    }

    function showToast(title, sub, onClick) {
      const host = document.getElementById('toastHost');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<div style="flex:1; min-width:0;"><div class="t-title"></div><div class="t-sub"></div></div>`;
      el.querySelector('.t-title').textContent = title;
      el.querySelector('.t-sub').textContent = sub;
      el.addEventListener('click', () => { if (onClick) onClick(); dismiss(); });
      host.appendChild(el);
      const timer = setTimeout(dismiss, 6000);
      function dismiss() { clearTimeout(timer); el.classList.add('out'); setTimeout(() => el.remove(), 250); }
    }

    function notifyNewMessage(client, msg) {
      const title = `New message · ${client.ref_id}`;
      const sub = (msg.message || (msg.image_urls && msg.image_urls.length ? '📎 Image/file' : 'Message'));
      playBeep();
      if (navigator.vibrate) try { navigator.vibrate([120, 60, 120]); } catch (e) {}
      showToast(title, sub, () => {
        if (client.id !== selectedClientId) showChat(client.id);
        else messagesEl.scrollTop = messagesEl.scrollHeight;
      });
      if (notifEnabled) {
        try {
          const n = new Notification(title, { body: sub, tag: 'helpry-' + client.id });
          n.onclick = () => { window.focus(); if (client.id !== selectedClientId) showChat(client.id); n.close(); };
        } catch (e) {}
      }
    }
    function initials(ref, name) {
      if (name && name.trim()) {
        const parts = name.trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('');
        if (parts) return parts.toUpperCase();
      }
      return (ref || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'TW';
    }

    function renderClients() {
      const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const filtered = clients.filter(c => {
        if (!q) return true;
        const hay = [c.name, c.email, c.ref_id, c.country].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
      if (!filtered.length) {
        clientListEl.innerHTML = clients.length
          ? '<li class="empty">No clients match your search.</li>'
          : '<li class="empty">No clients yet.<br>Tap the ✦ button to seed a demo conversation.</li>';
        return;
      }
      clientListEl.innerHTML = filtered.map(client => {
        const last = lastMessage(client);
        const preview = last
          ? (last.sender_type === 'admin' ? 'You: ' : '') + (last.message || '(image)')
          : 'No messages yet';
        const name = client.name || 'Unnamed visitor';
        const unread = unreadCounts[client.id] || 0;
        const online = !!client.email; // connected (has email) => reachable
        return `
          <li class="client-item ${selectedClientId === client.id ? 'active' : ''}" data-client-id="${client.id}">
            <div class="avatar">${initials(client.ref_id, client.name)}<span class="online-dot ${online ? 'on' : ''}"></span></div>
            <div class="row-main">
              <div class="row-top">
                <span class="row-name">${escapeHtml(name)}</span>
                <span class="row-time">${last ? formatTime(last.created_at) : ''}</span>
              </div>
              <div class="row-meta">${escapeHtml(client.ref_id)}${client.email ? ' · ' + escapeHtml(client.email) : ''}</div>
              <div class="row-preview">${escapeHtml(preview)}</div>
            </div>
            ${unread > 0 ? `<div class="badge unread">${unread > 99 ? '99+' : unread}</div>` : ''}
            <button class="del-btn" data-del-id="${client.id}" title="Delete user" aria-label="Delete user">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M10 11v6M14 11v6"></path></svg>
            </button>
          </li>`;
      }).join('');

      clientListEl.querySelectorAll('.client-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.closest('.del-btn')) return; // don't open chat when deleting
          showChat(Number(item.dataset.clientId));
        });
      });
      clientListEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = Number(btn.dataset.delId);
          const cl = clients.find(c => c.id === id);
          if (!confirm(`Delete ${cl ? cl.ref_id : 'this user'} and all their messages? This cannot be undone.`)) return;
          try {
            const res = await fetch(`/api/admin/clients/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || 'Delete failed');
            clients = clients.filter(c => c.id !== id);
            if (selectedClientId === id) selectedClientId = clients[0]?.id || null;
            renderClients();
            if (!chatView.classList.contains('hidden')) renderMessages();
          } catch (err) {
            alert(err.message);
          }
        });
      });

      // Total unread badge in the title bar
      const totalUnread = clients.reduce((sum, c) => sum + (unreadCounts[c.id] || 0), 0);
      const tu = document.getElementById('totalUnread');
      if (tu) {
        if (totalUnread > 0) {
          tu.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
          tu.style.display = 'inline-block';
          document.title = `(${totalUnread}) Helpry Admin`;
        } else {
          tu.style.display = 'none';
          document.title = 'Helpry Admin';
        }
      }
    }

    function renderMessages() {
      const selected = clients.find(c => c.id === selectedClientId);
      if (!selected) {
        messagesEl.innerHTML = '<div class="empty">No client selected.</div>';
        return;
      }
      document.getElementById('chatTitle').textContent = selected.name || 'Unnamed visitor';
      const bits = [];
      if (selected.email) bits.push(selected.email);
      bits.push(selected.ref_id);
      if (selected.country && selected.country !== 'Unknown') bits.push(selected.country);
      document.getElementById('chatSub').textContent = bits.join('  ·  ');
      const av = document.getElementById('chatAvatar');
      if (av) av.textContent = initials(selected.ref_id, selected.name);

      if (!selected.messages.length) {
        messagesEl.innerHTML = '<div class="empty">No messages yet. Say hello 👋</div>';
        return;
      }
      messagesEl.innerHTML = selected.messages.map(msg => {
        const imgs = (msg.image_urls || []).map(url => {
          const isImage = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(url) || url.startsWith('data:image') || url.startsWith('blob:');
          if (isImage) {
            return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="attachment" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;" /></a>`;
          }
          const name = (url.split('/').pop() || 'file').split('?')[0];
          return `<a href="${url}" target="_blank" rel="noopener" class="file-chip">📎 <span>${name}</span></a>`;
        }).join('');
        const grid = (msg.image_urls || []).length
          ? `<div class="media-grid">${imgs}</div>` : '';
        const text = msg.message ? `<div class="msg-text">${escapeHtml(msg.message)}</div>` : '';
        return `
        <div class="msg ${msg.sender_type === 'client' ? 'client' : 'admin'}">
          <div class="bubble">
            ${grid}
            ${text}
            <span class="t">${formatTime(msg.created_at)}</span>
          </div>
        </div>`;
      }).join('');
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showChat(clientId) {
      selectedClientId = clientId;
      unreadCounts[clientId] = 0;   // mark this conversation as read
      renderClients();
      renderMessages();
      listView.classList.add('hidden');
      chatView.classList.remove('hidden');
      // force reflow so the slide-in transition runs
      void chatView.offsetWidth;
      chatView.classList.add('active');
      setChatStatus('Live');
      const input = document.getElementById('replyInput');
      setTimeout(() => input.focus(), 280);
    }

    function showList() {
      chatView.classList.remove('active');
      setTimeout(() => {
        chatView.classList.add('hidden');
        listView.classList.remove('hidden');
      }, 280);
    }

    async function fetchClients() {
      try {
        const response = await fetch('/api/admin/clients');
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not load clients');
        clients = data.clients || [];
        if (!selectedClientId && clients.length) selectedClientId = clients[0].id;

        // Detect newly arrived CLIENT messages and notify.
        for (const c of clients) {
          for (const m of (c.messages || [])) {
            if (m.sender_type === 'client' && !knownMessageIds.has(m.id)) {
              if (knownMessageIds.size > 0) {
                notifyNewMessage(c, m); // skip the initial seed
                // count as unread unless this conversation is the one on screen
                if (c.id !== selectedClientId || chatView.classList.contains('hidden')) {
                  unreadCounts[c.id] = (unreadCounts[c.id] || 0) + 1;
                }
              }
              knownMessageIds.add(m.id);
            }
          }
        }

        renderClients();
        if (!chatView.classList.contains('hidden')) renderMessages();
        setStatus('Live');
      } catch (error) {
        setStatus('Offline', true);
        console.error(error);
      }
    }

    async function fetchStorageStatus() {
      try {
        const res = await fetch('/api/admin/storage-status');
        const d = await res.json();
        const note = document.getElementById('storageNote');
        if (d.persistent) {
          note.className = 'storage-note persistent';
          note.textContent = '✓ Users & chats are saved permanently (Redis connected).';
        } else {
          note.className = 'storage-note temp';
          note.textContent = '⚠ Not durable yet — link Upstash Redis in Vercel to save users permanently.';
        }
        note.style.display = 'block';
      } catch (e) { /* ignore */ }
    }

    async function sendReply() {
      if (!selectedClientId) { alert('Select a client first.'); return; }
      const input = document.getElementById('replyInput');
      const text = input.value.trim();
      const files = Array.from(adminFileInput.files || []);
      if (!text && files.length === 0) { alert('Type a message or attach a file.'); return; }

      const btn = document.getElementById('sendReplyBtn');
      btn.disabled = true;
      try {
        const form = new FormData();
        form.append('client_id', selectedClientId);
        if (text) form.append('message', text);
        files.forEach(f => form.append('images[]', f));

        const response = await fetch('/api/admin/reply', { method: 'POST', body: form });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Reply failed');
        input.value = '';
        input.style.height = 'auto';
        adminFileInput.value = '';
        updateAdminAttachBadge();
        await fetchClients();
        fetchStorageStatus();
        setChatStatus('Sent');
      } catch (error) {
        setChatStatus('Failed', true);
        console.error(error);
        alert(error.message);
      } finally {
        btn.disabled = false;
      }
    }

    function updateAdminAttachBadge() {
      const badge = document.getElementById('adminAttachBadge');
      const preview = document.getElementById('adminAttachPreview');
      const files = adminFileInput.files ? Array.from(adminFileInput.files) : [];
      const n = files.length;
      if (badge) {
        badge.textContent = n ? String(n) : '';
        badge.style.display = n ? 'block' : 'none';
      }
      if (preview) {
        if (n === 0) { preview.style.display = 'none'; preview.innerHTML = ''; return; }
        preview.style.display = 'flex';
        preview.innerHTML = files.map((f, i) => {
          const isImg = f.type.startsWith('image/');
          const thumb = isImg
            ? `<img src="${URL.createObjectURL(f)}" alt="">`
            : `<span class="fic">📎</span>`;
          return `<div class="atch-chip">${thumb}<span class="nm">${escapeHtml(f.name)}</span></div>`;
        }).join('');
      }
    }

    async function seedDemo() {
      try {
        const response = await fetch('/api/admin/seed-demo', { method: 'GET' });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Seed failed');
        await fetchClients();
        fetchStorageStatus();
        selectedClientId = clients[0]?.id || null;
        renderClients();
        renderMessages();
        setStatus('Demo seeded');
      } catch (error) {
        console.error(error);
        alert(error.message);
      }
    }

    // Composer auto-grow + Enter-to-send (Shift+Enter for newline)
    const replyInput = document.getElementById('replyInput');
    const adminFileInput = document.getElementById('adminFileInput');
    document.getElementById('attachAdminBtn').addEventListener('click', () => adminFileInput.click());
    adminFileInput.addEventListener('change', updateAdminAttachBadge);
    replyInput.addEventListener('input', () => {
      replyInput.style.height = 'auto';
      replyInput.style.height = Math.min(replyInput.scrollHeight, 120) + 'px';
    });
    replyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendReply();
      }
    });

    document.getElementById('sendReplyBtn').addEventListener('click', sendReply);
    document.getElementById('seedDemoBtn').addEventListener('click', seedDemo);
    document.getElementById('backBtn').addEventListener('click', showList);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // --- Auth gate ---
    const loginOverlay = document.getElementById('loginOverlay');
    const phone = document.getElementById('phone');
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('passwordInput');
    const loginError = document.getElementById('loginError');

    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/me', { method: 'GET' });
        const data = await res.json();
        if (data.authed) {
          loginOverlay.classList.add('hidden');
          phone.classList.remove('hidden');
          fetchClients();
          fetchStorageStatus();
          ensureNotifPermission();
        } else {
          loginOverlay.classList.remove('hidden');
          phone.classList.add('hidden');
        }
      } catch (e) {
        loginOverlay.classList.remove('hidden');
        phone.classList.add('hidden');
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const pwd = passwordInput.value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          passwordInput.value = '';
          loginOverlay.classList.add('hidden');
          phone.classList.remove('hidden');
          fetchClients();
          fetchStorageStatus();
          ensureNotifPermission();
        } else {
          loginError.textContent = data.error || 'Invalid password';
        }
      } catch (err) {
        loginError.textContent = 'Login failed. Try again.';
      }
    });

    // Live search filter on the conversations list.
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', () => renderClients());
    }

    async function logout() {
      try { await fetch('/api/admin/logout', { method: 'POST' }); } catch (e) {}
      loginOverlay.classList.remove('hidden');
      phone.classList.add('hidden');
    }

    checkAuth();
    setInterval(async () => {
      // only poll clients when authed and the console is visible
      if (!phone.classList.contains('hidden') && !loginOverlay.classList.contains('hidden')) return;
      if (phone.classList.contains('hidden')) return;
      await fetchClients();
    }, 5000);
  </script>
</body>
</html>
